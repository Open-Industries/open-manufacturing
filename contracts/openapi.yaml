openapi: 3.1.0
info:
  title: Open Manufacturing — Reference Manufacturing Core Platform — aggregate contract
  version: 1.0.0
  description: >
    Aggregate view of the platform's public REST contracts. The normative per-service
    contracts are generated from code by Quarkus SmallRye OpenAPI at `/openapi` on each
    service; CI diffs them against this file (see docs/api/api-standards.md).
    Conventions: RFC 9457 errors, Idempotency-Key on creates, lifecycle transitions
    take no body, explicit units on every quantity, all data synthetic.
servers:
  - url: https://api.example.org/api/v1
    description: Production (per adopter)
security:
  - bearerAuth: []
paths:
  /production-lines:
    post:
      operationId: create-line
      summary: "Production line registry per plant."
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/Problem' }
  /material-stock:
    post:
      operationId: create-stock
      summary: "Guarded material stock per plant and the issues to production against it."
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/Problem' }
  /quality-rules:
    post:
      operationId: create-quality
      summary: "Decision rules binding product families to batch-size and defect envelopes."
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/Problem' }
  /equipment:
    post:
      operationId: create-equipment
      summary: "Equipment registry (Asset Administration Shell posture)."
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/Problem' }
  /notifications:
    post:
      operationId: dispatch-notification
      summary: Dispatch a notification
      responses:
        '202': { description: Accepted }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema:
            type: object
            required: [type, title, status]
            properties:
              type: { type: string }
              title: { type: string }
              status: { type: integer }
              detail: { type: string }
